services:

  postgres:
    image: postgres:17
    container_name: possystem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: possistem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: possystem-backend
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/possistem
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
      JWT_SECRET: MzQ3ODk0NTYxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
      JWT_EXPIRATION: 86400000

volumes:
  postgres_data: